<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
    <head>
        {{ partial "head.html" . }}
        <style>
            /* Diagonal Background Bars */
            body::before {
                content: '';
                position: fixed;
                bottom: 50px;
                right: 50px;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: -1;
            }

            .diagonal-bars-container {
                position: fixed;
                bottom: -1vmin;
                left: 0;
                width: 100%;
                height: 50vh;
                pointer-events: none;
                z-index: -1;
                overflow: hidden;
            }

            .diagonal-bar {
                position: absolute;
                width: 1.5vmin;
                height: 200vh;
                transform: rotate(45deg);
                transform-origin: bottom center;
                bottom: 0;
                opacity: 0.2;
            }

            .diagonal-bar:nth-child(1) {
                background-color: #fca02b;
                right: calc(1.5 * 8 * 1.5vmin);
            }

            .diagonal-bar:nth-child(2) {
                background-color: #00bf63;
                right: calc(1.5 * 8 * 1.5vmin + 6 * 1.5vmin);
            }

            .diagonal-bar:nth-child(3) {
                background-color: #38b6ff;
                right: calc(1.5 * 8 * 1.5vmin + 12 * 1.5vmin);
            }

            .diagonal-bar:nth-child(4) {
                background-color: #8c52ff;
                right: calc(1.5 * 8 * 1.5vmin + 18 * 1.5vmin);
            }
        </style>
    </head>

    {{ block "body" . }}
        <body>
            <div class="diagonal-bars-container">
                <div class="diagonal-bar"></div>
                <div class="diagonal-bar"></div>
                <div class="diagonal-bar"></div>
                <div class="diagonal-bar"></div>
            </div>
    {{ end }}
    
        <div class="container">
            {{ partial "header.html" . }}

            {{ block "main" . }}{{ end }}

            {{ block "footer" . }}
                {{ partial "footer.html" . }}
            {{ end }}
        </div>

        {{ partial "javascript.html" . }}
    </body>
</html>
