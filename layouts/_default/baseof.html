<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
    <head>
        {{ partial "head.html" . }}
        <style>
            /* Diagonal Background Bars
             *
             * The palette is theme-aware: the light hues below only read on a
             * dark background — over white they wash out (#38b6ff at 0.2 opacity
             * blends to rgb(215,240,255), i.e. invisible). The light theme uses
             * deeper hues at a higher opacity so all four bars carry equal weight.
             */
            :root {
                --diagonal-bar-1: #d97706;
                --diagonal-bar-2: #00a152;
                --diagonal-bar-3: #0d80c9;
                --diagonal-bar-4: #7c4dff;
                --diagonal-bar-opacity: 0.35;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --diagonal-bar-1: #fca02b;
                    --diagonal-bar-2: #00bf63;
                    --diagonal-bar-3: #38b6ff;
                    --diagonal-bar-4: #8c52ff;
                    --diagonal-bar-opacity: 0.2;
                }
            }

            html[data-theme=light] {
                --diagonal-bar-1: #d97706;
                --diagonal-bar-2: #00a152;
                --diagonal-bar-3: #0d80c9;
                --diagonal-bar-4: #7c4dff;
                --diagonal-bar-opacity: 0.35;
            }

            html[data-theme=dark] {
                --diagonal-bar-1: #fca02b;
                --diagonal-bar-2: #00bf63;
                --diagonal-bar-3: #38b6ff;
                --diagonal-bar-4: #8c52ff;
                --diagonal-bar-opacity: 0.2;
            }

            body::before {
                content: '';
                position: fixed;
                bottom: 50px;
                right: 50px;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: -1;
            }

            .diagonal-bars-container {
                position: fixed;
                bottom: -1vmin;
                left: 0;
                width: 100%;
                height: 50vh;
                pointer-events: none;
                z-index: -1;
                overflow: hidden;
            }

            .diagonal-bar {
                position: absolute;
                width: 1.5vmin;
                height: 200vh;
                transform: rotate(45deg);
                transform-origin: bottom center;
                bottom: 0;
                opacity: var(--diagonal-bar-opacity);
            }

            .diagonal-bar:nth-child(1) {
                background-color: var(--diagonal-bar-1);
                right: calc(1.5 * 8 * 1.5vmin);
            }

            .diagonal-bar:nth-child(2) {
                background-color: var(--diagonal-bar-2);
                right: calc(1.5 * 8 * 1.5vmin + 6 * 1.5vmin);
            }

            .diagonal-bar:nth-child(3) {
                background-color: var(--diagonal-bar-3);
                right: calc(1.5 * 8 * 1.5vmin + 12 * 1.5vmin);
            }

            .diagonal-bar:nth-child(4) {
                background-color: var(--diagonal-bar-4);
                right: calc(1.5 * 8 * 1.5vmin + 18 * 1.5vmin);
            }
        </style>
    </head>

    {{ block "body" . }}
        <body>
            <div class="diagonal-bars-container">
                <div class="diagonal-bar"></div>
                <div class="diagonal-bar"></div>
                <div class="diagonal-bar"></div>
                <div class="diagonal-bar"></div>
            </div>
    {{ end }}
    
        <div class="container">
            {{ partial "header.html" . }}

            {{ block "main" . }}{{ end }}

            {{ block "footer" . }}
                {{ partial "footer.html" . }}
            {{ end }}
        </div>

        {{ partial "javascript.html" . }}
    </body>
</html>
